name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Lint, test and offline eval gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Unit, security and API tests
        run: pytest -q
      - name: Evaluation quality gate (offline, deterministic)
        run: python -m kcopilot.evaluation --gate --out eval-offline
      - uses: actions/upload-artifact@v4
        with:
          name: eval-offline
          path: eval-offline/

  eval-neural:
    name: Eval with neural embeddings + cross-encoder
    runs-on: ubuntu-latest
    needs: test
    # Downloads models from Hugging Face; reported in the job summary but non-blocking
    # so a model-hub outage never breaks the build.
    continue-on-error: true
    env:
      KC_EMBEDDER: fastembed
      KC_RERANKER: cross-encoder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[neural]"
      - name: Run evaluation (gate enforced)
        run: python -m kcopilot.evaluation --gate --out eval-neural
      - name: Publish report to job summary
        if: always()
        run: cat eval-neural/report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-neural
          path: eval-neural/

  secrets-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t enterprise-knowledge-copilot .
